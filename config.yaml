project:
  name: 机器视觉解决方案书自动生成系统
  language: zh-CN

paths:
  image_library: "D:/20261012/知识库数据"   # 图片库根目录（简介=图片名，递归扫描）
  ppt_template: data/templates/视觉方案书格式.pptx   # 方案书 PPT 模板
  ppt_profile: data/templates/visual_proposal_profile.yaml  # 模板画像（页序/版式/样式）
  template_dir: data/image_templates              # 可拼模板库（透明底设备示意图）
  knowledge: data/knowledge                # 文本知识库（方案素材、图例规范、模板）
  samples: data/samples                    # 示例需求输入
  output: output                           # 生成产物输出目录

llm:
  provider: deepseek                       # deepseek | dashscope | openai | mock
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.3

embedding:
  provider: bge                            # bge(本地中文模型,默认) | dashscope/openai(API) | hash(兜底)
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  model: BAAI/bge-small-zh-v1.5
  dim: 512

search:
  backend: sqlite                # 精准匹配后端：sqlite（本地元数据）| es（Elasticsearch）
  es_url: http://127.0.0.1:9200
  es_index: vision_templates
  vector_weight: 0.5             # 向量模糊权重
  precise_weight: 0.5            # 精准匹配权重

storage:
  vectorstore: data/vector.db              # SQLite 持久化向量库
  model_cache: .model_cache                # 本地 embedding 模型缓存目录

retrieval:
  top_k: 3
  score_threshold: 0.0

framework:
  # 机器视觉设备类型及其在框架图中的分组
  groups:
    - {key: capture, label: 图像采集单元}
    - {key: process, label: 图像处理单元}
    - {key: execute, label: 执行与输出单元}
  device_types:
    light_source: {label: 光源,       group: capture}
    lens:         {label: 镜头,       group: capture}
    camera:       {label: 工业相机,   group: capture}
    controller:   {label: 控制器/采集卡, group: process}
    ipc:          {label: 工控机/视觉主机, group: process}
    output:       {label: 执行输出(PLC/机器人/显示器), group: execute}
    accessory:    {label: 附件,       group: capture}
  # 默认光路/数据链路：上一环节 -> 下一环节（按 device_type）
  chain:
    - [light_source, lens]
    - [lens, camera]
    - [camera, controller]
    - [controller, ipc]
    - [ipc, output]

export:
  formats: [markdown, html, docx, pdf]
  image_dpi: 150
vlm:
  provider: dashscope
  model: qwen3-vl-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
